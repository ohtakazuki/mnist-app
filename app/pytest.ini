[pytest]
# アプリ本体（inference.py / model.py など）はフラット配置で `from inference import ...`
# のように import される。tests/ をサブディレクトリにしてもプロジェクト直下を
# import パスに含めるため pythonpath を通しておく（pytest 7 以降のオプション）。
pythonpath = .
testpaths = tests
# 警告を見やすく（gradio の analytics 警告などは無視）
filterwarnings =
    ignore::UserWarning
markers =
    e2e: 本物の重み・サーバを使うエンドツーエンドテスト（遅い・環境依存）
